# ============================================================================
# REPLAY PROCESSING
# ============================================================================

[replay]
enabled = true
buffer_hours = 24
trigger_mode = "time_based"
max_buffer_measurements = 100
state_history_limit = 100

[replay.outlier_detection]
iqr_multiplier = 1.5
z_score_threshold = 3.0
temporal_max_change_percent = 0.5
min_measurements_for_analysis = 2

[replay.safety]
max_processing_time_seconds = 60
require_rollback_confirmation = false
preserve_immediate_results = true

# ============================================================================
# SNAPSHOT CONFIGURATION
# ============================================================================

[snapshot]
periodic_enabled = true
interval_hours = 24
retention_days = 10

# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================

[database]
backend = "memory"  # Options: "memory", "dynamodb"
table_name = "weight-processor-state"
region = "us-east-1"

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================

[logging]
level = "INFO"
verbose = false
