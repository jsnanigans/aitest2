AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Weight Processor Service - Serverless API

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Environment:
      Variables:
        LOG_LEVEL: INFO
        DB_BACKEND: dynamodb
        DYNAMODB_TABLE_NAME: !Ref StateTable
        AWS_REGION: !Ref AWS::Region
        ENVIRONMENT: !Ref Environment

Resources:
  # API Gateway
  WeightProcessorApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub weight-processor-${Environment}
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET, POST, DELETE, OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

  # Lambda Function
  WeightProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        RequirementsFile: requirements-lambda.txt
    Properties:
      FunctionName: !Sub weight-processor-${Environment}
      CodeUri: .
      Handler: src.lambda_handler.handler
      Runtime: python3.12
      Description: Process weight measurements with Kalman filtering
      Environment:
        Variables:
          KALMAN_ENABLED: 'true'
          KALMAN_ADAPTIVE: 'true'
          KALMAN_PROCESS_NOISE: '1.0'
          KALMAN_OBS_NOISE: '4.0'
          KALMAN_HARD_GAP_DAYS: '30'
          QUALITY_SCORING_ENABLED: 'true'
          QS_WEIGHT_KALMAN: '0.4'
          QS_WEIGHT_TEMPORAL: '0.3'
          QS_WEIGHT_SOURCE: '0.3'
          QS_OUTLIER_OVERRIDE: '0.8'
          OUTLIER_DETECTION_ENABLED: 'true'
          OUTLIER_IQR_MULTIPLIER: '1.5'
          REPLAY_ENABLED: 'false'
      Events:
        HealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref WeightProcessorApi
            Path: /api/v1/health
            Method: GET
            Auth:
              ApiKeyRequired: false
        ProcessMeasurements:
          Type: Api
          Properties:
            RestApiId: !Ref WeightProcessorApi
            Path: /api/v1/process/{userId}
            Method: POST
            Auth:
              ApiKeyRequired: true
        CleanupUser:
          Type: Api
          Properties:
            RestApiId: !Ref WeightProcessorApi
            Path: /api/v1/cleanup/{userId}
            Method: POST
            Auth:
              ApiKeyRequired: true
        ReplayMeasurements:
          Type: Api
          Properties:
            RestApiId: !Ref WeightProcessorApi
            Path: /api/v1/replay/{userId}
            Method: POST
            Auth:
              ApiKeyRequired: true
        GetUserState:
          Type: Api
          Properties:
            RestApiId: !Ref WeightProcessorApi
            Path: /api/v1/state/{userId}
            Method: GET
            Auth:
              ApiKeyRequired: true
        DeleteUserState:
          Type: Api
          Properties:
            RestApiId: !Ref WeightProcessorApi
            Path: /api/v1/state/{userId}
            Method: DELETE
            Auth:
              ApiKeyRequired: true
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - CloudWatchLambdaInsightsExecutionRolePolicy
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:580247275435:layer:LambdaInsightsExtension:38

  # DynamoDB Table for State Storage
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub weight-processor-state-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: stateType
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: stateType
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: weight-processor

  # API Key for authentication
  WeightProcessorApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub weight-processor-key-${Environment}
      Description: API key for Weight Processor Service
      Enabled: true
      StageKeys:
        - RestApiId: !Ref WeightProcessorApi
          StageName: !Ref Environment

  # CloudWatch Log Group
  ProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/weight-processor-${Environment}
      RetentionInDays: 30

  # CloudWatch Alarms
  ProcessorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub weight-processor-errors-${Environment}
      AlarmDescription: Alert when processor function errors exceed threshold
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref WeightProcessorFunction
      TreatMissingData: notBreaching

  ProcessorThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub weight-processor-throttles-${Environment}
      AlarmDescription: Alert when processor function is throttled
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref WeightProcessorFunction
      TreatMissingData: notBreaching

  DynamoDBThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub weight-processor-db-throttles-${Environment}
      AlarmDescription: Alert when DynamoDB throttles requests
      MetricName: ConsumedReadCapacityUnits
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref StateTable
      TreatMissingData: notBreaching

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${WeightProcessorApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub weight-processor-api-${Environment}

  ApiKeyId:
    Description: API Key ID for authentication
    Value: !Ref WeightProcessorApiKey

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt WeightProcessorFunction.Arn
    Export:
      Name: !Sub weight-processor-function-${Environment}

  StateTableName:
    Description: DynamoDB table name
    Value: !Ref StateTable
    Export:
      Name: !Sub weight-processor-table-${Environment}

  StateTableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt StateTable.Arn
    Export:
      Name: !Sub weight-processor-table-arn-${Environment}