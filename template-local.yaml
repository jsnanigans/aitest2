AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Weight Processor Service - Local Development (No Auth)

Parameters:
  Environment:
    Type: String
    Default: local
    Description: Environment name

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Environment:
      Variables:
        LOG_LEVEL: DEBUG
        DB_BACKEND: memory
        ENVIRONMENT: local

Resources:
  # API Gateway - No authentication for local development
  WeightProcessorApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: weight-processor-local
      StageName: local
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"
      # No Auth configuration - all endpoints open for local testing

  # Lambda Function
  WeightProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        RequirementsFile: requirements-lambda.txt
    Properties:
      FunctionName: weight-processor-local
      CodeUri: .
      Handler: src.lambda_handler.handler
      Runtime: python3.12
      Description: Process weight measurements with Kalman filtering (LOCAL)
      Environment:
        Variables:
          KALMAN_ENABLED: 'true'
          KALMAN_ADAPTIVE: 'true'
          KALMAN_PROCESS_NOISE: '1.0'
          KALMAN_OBS_NOISE: '4.0'
          KALMAN_HARD_GAP_DAYS: '30'
          QUALITY_SCORING_ENABLED: 'true'
          QS_WEIGHT_KALMAN: '0.4'
          QS_WEIGHT_TEMPORAL: '0.3'
          QS_WEIGHT_SOURCE: '0.3'
          QS_OUTLIER_OVERRIDE: '0.8'
          OUTLIER_DETECTION_ENABLED: 'true'
          OUTLIER_IQR_MULTIPLIER: '1.5'
          REPLAY_ENABLED: 'true'
      Events:
        HealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref WeightProcessorApi
            Path: /api/v1/health
            Method: GET
        ProcessMeasurements:
          Type: Api
          Properties:
            RestApiId: !Ref WeightProcessorApi
            Path: /api/v1/process/{userId}
            Method: POST
        CleanupUser:
          Type: Api
          Properties:
            RestApiId: !Ref WeightProcessorApi
            Path: /api/v1/cleanup/{userId}
            Method: POST
        ReplayMeasurements:
          Type: Api
          Properties:
            RestApiId: !Ref WeightProcessorApi
            Path: /api/v1/replay/{userId}
            Method: POST
        GetUserState:
          Type: Api
          Properties:
            RestApiId: !Ref WeightProcessorApi
            Path: /api/v1/state/{userId}
            Method: GET
        DeleteUserState:
          Type: Api
          Properties:
            RestApiId: !Ref WeightProcessorApi
            Path: /api/v1/state/{userId}
            Method: DELETE

Outputs:
  ApiEndpoint:
    Description: Local API Gateway endpoint URL
    Value: !Sub https://${WeightProcessorApi}.execute-api.${AWS::Region}.amazonaws.com/local

  LocalMessage:
    Description: Local development notes
    Value: "This template is for local development only. No authentication is required for any endpoint."