# SAM CLI configuration file
# For local testing with sam local start-api

version = 0.1

[default]
[default.global]
[default.global.parameters]
stack_name = "weight-processor-local"

[default.build]
[default.build.parameters]
cached = true
parallel = true
use_container = false

[default.local_start_api]
[default.local_start_api.parameters]
port = 3000
host = "127.0.0.1"
env_vars = "env.json"
parameter_overrides = "Environment=local"
docker_network = "weight-processor-net"
skip_pull_image = true
warm_containers = "EAGER"
debug_port = 5678

[default.local_start_lambda]
[default.local_start_lambda.parameters]
port = 3001
host = "127.0.0.1"
env_vars = "env.json"
parameter_overrides = "Environment=local"
docker_network = "weight-processor-net"
skip_pull_image = true
warm_containers = "EAGER"

[default.local_invoke]
[default.local_invoke.parameters]
env_vars = "env.json"
parameter_overrides = "Environment=local"
docker_network = "weight-processor-net"
log_file = "./logs/lambda-invoke.log"

[dev]
[dev.deploy]
[dev.deploy.parameters]
stack_name = "weight-processor-dev"
s3_bucket = "weight-processor-deployments-dev"
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Environment=dev"
confirm_changeset = true

[staging]
[staging.deploy]
[staging.deploy.parameters]
stack_name = "weight-processor-staging"
s3_bucket = "weight-processor-deployments-staging"
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Environment=staging"
confirm_changeset = true

[prod]
[prod.deploy]
[prod.deploy.parameters]
stack_name = "weight-processor-prod"
s3_bucket = "weight-processor-deployments-prod"
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Environment=prod"
confirm_changeset = true