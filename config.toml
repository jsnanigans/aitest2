# ============================================================================
# SIMPLE CONFIGURATION
# Most users only need to modify this section
# ============================================================================

# Choose a processing profile
# Options: "conservative", "balanced", "aggressive", "clinical", "custom"
profile = "custom"

# Data source settings
[data]
csv_file = "./data/2025-09-05_nocon.csv"
output_dir = "output"
max_users = 100
user_offset = 0
min_readings = 20
min_date = "2015-01-01"
max_date = "2026-01-01"
export_database = true

# Test users - if defined, only these users will be processed
# Priority: test_users > filtered_users_csv > test_users_file
# Uncomment and add user IDs to test specific users
# test_users = ["user_001", "user_002", "user_003"]
filtered_users_csv = "create-report/report_output/filtered_users_APPLE_EMPLOYER_20250919_104340.csv"
test_users = [
