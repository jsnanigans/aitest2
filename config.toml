# ============================================================================
# WEIGHT PROCESSING CONFIGURATION
# ============================================================================

# Data source settings
[data]
csv_file = "./data/2025-09-05_nocon.csv"
output_dir = "output"
max_users = 100
user_offset = 0
min_readings = 20
min_date = "2015-01-01"
max_date = "2026-01-01"
export_database = true

# Test users configuration
filtered_users_csv = "create-report/report_output/filtered_users_APPLE_EMPLOYER_20250919_104340.csv"
# Test with actual users from the CSV
test_users = [
  "00088d03-2305-4032-852a-354d0786ad87",
  "001adb56-40a5-4ef2-a092-e20915e0fb81",
  "001b4e0a-535f-4713-b262-bdd4e5b89b7d",
]

# ============================================================================
# PROCESSING SETTINGS
# ============================================================================

[processing]
quality_threshold = 0.46  # Minimum quality score to accept (46%)

# ============================================================================
# VISUALIZATION
# ============================================================================

[visualization]
detail_level = "normal"  # Options: "minimal", "normal", "detailed"

[visualization.threading]
max_workers = 8        # Maximum number of threads (0 = auto-detect)
timeout_seconds = 30   # Maximum time per visualization

# ============================================================================
# KALMAN FILTER
# ============================================================================

[kalman]
initial_variance = 0.364
transition_covariance_weight = 0.018
transition_covariance_trend = 0.00015
observation_covariance = 3.4

# ============================================================================
# RESET CONFIGURATION
# ============================================================================

[kalman.reset.initial]
enabled = true
initial_variance_multiplier = 10
weight_noise_multiplier = 50
trend_noise_multiplier = 50
observation_noise_multiplier = 20
adaptation_measurements = 10
adaptation_days = 10
adaptation_decay_rate = 2.5

[kalman.reset.hard]
enabled = true
gap_threshold_days = 30
initial_variance_multiplier = 3
weight_noise_multiplier = 5
trend_noise_multiplier = 50
observation_noise_multiplier = 0.7
adaptation_measurements = 10
adaptation_days = 7
adaptation_decay_rate = 2.5

[kalman.reset.soft]
enabled = true
min_weight_change_kg = 5
cooldown_days = 3
trigger_sources = ["questionnaire", "patient-upload", "care-team-upload"]
initial_variance_multiplier = 2
weight_noise_multiplier = 5
trend_noise_multiplier = 20
observation_noise_multiplier = 0.7
adaptation_measurements = 15
adaptation_days = 10
adaptation_decay_rate = 2.5

# ============================================================================
# ADAPTIVE SETTINGS
# ============================================================================

[adaptive_ranges]
enabled = true
ema_alpha = 0.1           # Learning rate for exponential moving averages
noise_alpha = 0.05        # Learning rate for noise estimation
buffer_size = 7           # Days of recent history to maintain

[adaptive_ranges.thresholds]
base_multiplier = 3.0
min_threshold = 1.0       # Minimum threshold in kg
max_threshold = 10.0      # Maximum threshold in kg

[adaptive_ranges.oscillation]
high_oscillation_score = 0.5
moderate_oscillation_score = 0.3

[adaptive_noise]
# Source reliability multipliers (lower = more trusted)
[adaptive_noise.source_multipliers]
care-team-upload = 0.5
patient-upload = 0.7
questionnaire = 0.8
patient-device = 1.0
connectivehealth-io = 1.5
iglucose-com = 3.0

# ============================================================================
# REPLAY PROCESSING
# ============================================================================

[replay]
enabled = true
buffer_hours = 48
trigger_mode = "time_based"
max_buffer_measurements = 100
state_history_limit = 100

[replay.outlier_detection]
iqr_multiplier = 1.5
z_score_threshold = 3.0
temporal_max_change_percent = 0.5
min_measurements_for_analysis = 2

[replay.safety]
max_processing_time_seconds = 60
require_rollback_confirmation = false
preserve_immediate_results = true

# ============================================================================
# QUALITY SCORING
# ============================================================================

[quality_scoring]
use_harmonic_mean = true
threshold = 0.46

# Component weights for unified quality scorer (must sum to 1.0)
[quality_scoring.component_weights]
kalman_fit = 0.65
temporal_consistency = 0
anomaly_detection = 0.25
source_reliability = 0
trend_alignment = 0.1

# Temporal consistency parameters
[quality_scoring.temporal]
min_score = 0.2
max_score = 1.0
initial_threshold_kg = 0.5
max_threshold_kg = 5.0
time_constant_hours = 48

# Trend alignment parameters
[quality_scoring.trend_alignment]
trend_decay_constant = 0.1
trend_min_std_dev = 0.8

# ============================================================================
# DATABASE & ANALYSIS
# ============================================================================

[database]
path = "data/weight_tracking.db"

[analysis]
# Interval configuration
interval_days = 30
window_tolerance_days = 7
max_intervals = 12
# Report configuration
top_users_count = 200
min_measurements_required = 2
batch_size = 100
# Visualization settings
generate_individual_charts = true
chart_dpi = 150
summary_chart_dpi = 300
parallel_visualization = true
# Data quality thresholds
min_data_completeness = 0.2
outlier_threshold_multiplier = 2

# ============================================================================
# LOGGING
# ============================================================================

[logging]
progress_interval = 10000
timestamp_format = "test_no_date"